{% extends 'base.html' %}
{% block title %}{% if book %}Edit{% else %}Add{% endif %} Book - Library MS{% endblock %}
{% block content %}
    <h1>{% if book %}Edit Book{% else %}Add New Book{% endif %}</h1>

    <form method="post" class="form">
        <label>Title
            <input type="text" name="title" value="{{ book.title if book else '' }}" required>
        </label>
        <label>Author
            <input type="text" name="author" value="{{ book.author if book else '' }}" required>
        </label>
        <label>ISBN
            <input type="text" name="isbn" value="{{ book.isbn if book else '' }}" required>
        </label>
        <label>Category
            <input type="text" name="category" value="{{ book.category if book else '' }}">
        </label>
        <label>Total Copies
            <input type="number" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}" required>
        </label>

        <button type="submit" class="btn btn-primary">{% if book %}Save Changes{% else %}Add Book{% endif %}</button>
        <a href="{{ url_for('books') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
