<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Out - Noor Abayas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #10161f 0%, #1e2a3a 60%, #2c3b52 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            margin: 0; padding: 20px;
        }
        .auth-card {
            background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25); text-align: center;
        }
        .brand-icon {
            width: 64px; height: 64px; border-radius: 50%; background: #fdeaea; color: #dc3545;
            display: flex; align-items: center; justify-content: center; font-size: 1.9rem; margin: 0 auto 18px;
        }
        .btn-danger-custom {
            background: #dc3545; border: none; color: #fff; font-weight: 600; padding: 11px;
            border-radius: 8px; transition: 0.2s ease;
        }
        .btn-danger-custom:hover { background: #b02a37; color: #fff; }
        .btn-cancel {
            background: #f1f3f5; border: none; color: #33475b; font-weight: 600; padding: 11px;
            border-radius: 8px; transition: 0.2s ease;
        }
        .btn-cancel:hover { background: #e2e6ea; color: #33475b; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-icon"><i class="bi bi-box-arrow-right"></i></div>
    <h4 class="fw-bold mb-2">Log Out?</h4>
    <p class="text-muted mb-4">
        You're about to sign out of <strong>Noor Abayas</strong>{% if current_user.is_authenticated %}, {{ current_user.username }}{% endif %}.
        Are you sure you want to continue?
    </p>

    <form method="POST" action="{{ url_for('logout') }}" id="logoutForm">
        <button type="submit" class="btn btn-danger-custom w-100 mb-2" id="logoutBtn">
            <span id="logoutBtnText"><i class="bi bi-box-arrow-right"></i> Yes, Log Out</span>
            <span class="spinner-border spinner-border-sm d-none" id="logoutSpinner" role="status"></span>
        </button>
    </form>

    <a href="{{ url_for('storefront') }}" class="btn btn-cancel w-100">Cancel</a>
</div>

<script>
    document.getElementById('logoutForm').addEventListener('submit', function () {
        document.getElementById('logoutBtnText').classList.add('d-none');
        document.getElementById('logoutSpinner').classList.remove('d-none');
        document.getElementById('logoutBtn').disabled = true;
    });
</script>
</body>
</html>
